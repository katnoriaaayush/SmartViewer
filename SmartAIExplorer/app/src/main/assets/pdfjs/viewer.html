<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartViewer PDF</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
    }

    body {
      background: #E9EBEF;
      font-family: system-ui, sans-serif;
    }

    /* ── Status / loading overlay ─────────────────────────────────────── */
    #status {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #606774;
      font-size: 16px;
    }
    #status .spinner {
      width: 36px; height: 36px;
      border: 3px solid #D6DAE1;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Page container ───────────────────────────────────────────────── */
    #viewerContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow-y: auto; overflow-x: auto;
      display: none;               /* shown after first render */
      flex-direction: column;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
      gap: 16px;
    }

    .pageContainer {
      position: relative;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 1px 3px rgba(16,19,25,0.12), 0 4px 14px rgba(16,19,25,0.08);
      flex-shrink: 0;
    }

    canvas { display: block; }

    /* ── PDF.js text layer ────────────────────────────────────────────── */
    .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      z-index: 2;
    }
    .textLayer :is(span, br) {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    /* Indigo highlight on selection */
    .textLayer ::selection {
      background: rgba(79, 70, 229, 0.30) !important;
      color: transparent;
    }
    /* Page number label */
    .pageLabel {
      font-size: 12px;
      color: #98A0AD;
      text-align: center;
      padding: 2px 0;
      align-self: center;
    }
  </style>
</head>
<body>

<div id="status">
  <div class="spinner"></div>
</div>

<div id="viewerContainer"></div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// SmartViewer — PDF.js 6 viewer
// Served via WebViewAssetLoader at:
//   https://appassets.androidplatform.net/assets/pdfjs/viewer.html
// ─────────────────────────────────────────────────────────────────────────────

import * as pdfjsLib from './pdf.mjs';

// Worker is served from the same origin so no CORS issue
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://appassets.androidplatform.net/assets/pdfjs/pdf.worker.mjs';

// ── State ────────────────────────────────────────────────────────────────────
let pdfDoc     = null;
let startPage  = 1;
let endPage    = 1;
let scale      = 1.5;
const DPR      = window.devicePixelRatio || 1;
let rendering  = false;

const statusEl    = document.getElementById('status');
const containerEl = document.getElementById('viewerContainer');

// ── Android ↔ JS bridge ──────────────────────────────────────────────────────
function notifyAndroid(text) {
  try {
    if (window.AndroidBridge && text && text.trim().length > 0) {
      window.AndroidBridge.onTextSelected(text.trim());
    }
  } catch (_) {}
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) {
    notifyAndroid(sel.toString());
  }
});

// Dismiss selection toolbar when user taps empty area
document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.textLayer')) {
    try { window.AndroidBridge?.onTextSelected(''); } catch (_) {}
  }
});

// ── Public API (called from Kotlin via evaluateJavascript) ───────────────────

/**
 * loadPDF(base64Data, startPageNum, endPageNum)
 * Called by Kotlin after onPageFinished.
 */
window.loadPDF = async function(base64Data, start, end) {
  startPage = Math.max(1, start || 1);
  endPage   = Math.max(startPage, end || start || 1);

  showStatus();

  try {
    // Decode base64 → Uint8Array
    const binary = atob(base64Data);
    const buf    = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) buf[i] = binary.charCodeAt(i);

    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    await renderRange();
  } catch (err) {
    containerEl.innerHTML =
      `<p style="color:#DC2626;padding:24px;font-size:15px">Failed to load PDF: ${err.message}</p>`;
    hideStatus();
    console.error('loadPDF error', err);
  }
};

/** setZoom(newScale) — called by zoom +/- buttons in Kotlin */
window.setZoom = async function(newScale) {
  scale = Math.max(0.5, Math.min(4.0, parseFloat(newScale) || 1.5));
  if (pdfDoc && !rendering) await renderRange();
};

/** scrollToPage(pageNum) — smooth scroll to a page */
window.scrollToPage = function(pageNum) {
  const el = document.getElementById('page-' + pageNum);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

// ── Renderer ─────────────────────────────────────────────────────────────────

async function renderRange() {
  if (rendering) return;
  rendering = true;
  containerEl.innerHTML = '';
  const last = Math.min(endPage, pdfDoc.numPages);

  // Pre-insert ordered slot + label pairs so page order is always preserved
  // even though individual renders complete out of order.
  for (let n = startPage; n <= last; n++) {
    const slot = document.createElement('div');
    slot.id = 'slot-' + n;
    containerEl.appendChild(slot);
    const label = document.createElement('div');
    label.className = 'pageLabel';
    label.textContent = `Page ${n}`;
    containerEl.appendChild(label);
  }

  let firstReady = false;

  await Promise.all(
    Array.from({ length: last - startPage + 1 }, (_, i) => startPage + i)
      .map(async (n) => {
        try {
          const page    = await pdfDoc.getPage(n);
          const wrapper = await renderPage(page, n);
          document.getElementById('slot-' + n)?.replaceWith(wrapper);
        } catch (e) {
          console.warn('Failed to render page', n, e);
        }
        // JS is single-threaded: this check is race-free.
        // Reveal the container the moment any page is ready.
        if (!firstReady) {
          firstReady = true;
          hideStatus();
        }
      })
  );

  rendering = false;
  if (!firstReady) hideStatus(); // all pages failed edge-case
}

async function renderPage(page, pageNum) {
  // Two viewports: hi-DPR for canvas pixel fidelity, CSS-scale for layout
  const cssViewport = page.getViewport({ scale });
  const hiDprViewport = page.getViewport({ scale: scale * DPR });

  const wrapper = document.createElement('div');
  wrapper.className = 'pageContainer';
  wrapper.id = 'page-' + pageNum;
  wrapper.style.width  = cssViewport.width  + 'px';
  wrapper.style.height = cssViewport.height + 'px';

  // ── Canvas ───────────────────────────────────────────────────────────
  const canvas  = document.createElement('canvas');
  canvas.width  = hiDprViewport.width;
  canvas.height = hiDprViewport.height;
  canvas.style.width  = cssViewport.width  + 'px';
  canvas.style.height = cssViewport.height + 'px';

  await page.render({
    canvasContext: canvas.getContext('2d'),
    viewport: hiDprViewport,
  }).promise;

  // ── Text layer (PDF.js 6 TextLayer class) ────────────────────────────
  const textDiv = document.createElement('div');
  textDiv.className = 'textLayer';

  try {
    const textLayer = new pdfjsLib.TextLayer({
      textContentSource: page.streamTextContent(),
      container:         textDiv,
      viewport:          cssViewport,
    });
    await textLayer.render();
  } catch (e) {
    // Graceful fallback — PDF still visible, just no text selection
    console.warn('TextLayer render failed for page', pageNum, e);
  }

  wrapper.appendChild(canvas);
  wrapper.appendChild(textDiv);
  return wrapper;
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function showStatus() {
  statusEl.style.display    = 'flex';
  containerEl.style.display = 'none';
}

function hideStatus() {
  statusEl.style.display    = 'none';
  containerEl.style.display = 'flex';
}
</script>
</body>
</html>
